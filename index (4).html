<style data-keep>
        :root {
            --camp-red-light: #FF4D4D;
            --camp-red-dark: #E21F26;
            --camp-yellow: #facc15;
            --camp-dark: #1a1a1a;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        body { 
            font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; 
            background-color: var(--camp-red-light);
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 30%), radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 30%);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1, h2, h3, .bungee { font-family: 'Bungee', Impact, 'Arial Black', sans-serif; }

        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .bg-element { position: fixed; z-index: -1; opacity: 0.25; pointer-events: none; animation: float 8s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(15deg); } }

        .bubble-card { 
            background: var(--camp-red-dark);
            border-radius: 2rem;
            box-shadow: 0 15px 0px rgba(0, 0, 0, 0.2);
            border: 6px solid var(--camp-dark);
            color: white;
            width: 100%;
            max-width: 550px;
            z-index: 10;
            position: relative;
        }
        
        @media (min-width: 768px) {
            .bubble-card { border-radius: 3.5rem; border-width: 8px; box-shadow: 0 25px 0px rgba(0, 0, 0, 0.2); max-width: 700px; }
        }

        .btn-option {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 3px solid var(--camp-dark);
            border-radius: 1.25rem;
            box-shadow: 0 4px 0 var(--camp-dark);
            width: 100%;
            text-align: left;
            padding: 0.6rem 1rem;
            background: white;
            color: black;
            font-weight: 700;
            font-size: 0.85rem;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        @media (min-width: 768px) {
            .btn-option { border-width: 4px; border-radius: 2rem; box-shadow: 0 6px 0 var(--camp-dark); padding: 1rem 1.5rem; font-size: 1.05rem; }
        }

        .btn-option:hover { background: #f9f9f9; transform: translateY(-2px); box-shadow: 0 6px 0 var(--camp-dark); }
        .btn-option:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--camp-dark); }

        .age-card {
            border: 3px solid var(--camp-dark); border-radius: 1.5rem; box-shadow: 0 6px 0 var(--camp-dark);
            transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.25rem;
            cursor: pointer;
        }
        .age-card:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--camp-dark); }

        .progress-container { border: 3px solid var(--camp-dark); border-radius: 1rem; overflow: hidden; background: var(--camp-dark); height: 1.25rem; }
        .btn-back { background: #333; border: 2px solid black; border-radius: 0.75rem; color: white; font-family: 'Bungee', Impact, 'Arial Black', sans-serif; font-size: 0.7rem; padding: 0.25rem 0.75rem; box-shadow: 0 3px 0 black; }
        .avatar-box { width: 100px; height: 100px; background: white; border: 4px solid black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin: 0 auto; box-shadow: 0 6px 0 black; }
        .camp-logo-placeholder { background: white; color: var(--camp-red-dark); font-family: 'Bungee', Impact, 'Arial Black', sans-serif; padding: 10px 25px; border-radius: 2rem; border: 4px solid black; display: inline-block; margin-bottom: 25px; font-size: 1.5rem; box-shadow: 0 5px 0 black; }
        .btn-action { background: var(--camp-yellow); border: 4px solid black; padding: 1rem 2.5rem; border-radius: 1.25rem; font-family: 'Bungee', Impact, 'Arial Black', sans-serif; color: black; box-shadow: 0 8px 0 #000; transition: all 0.1s; text-transform: uppercase; display: inline-block; cursor: pointer; }
        
        .cat-badge { display: inline-block; padding: 4px 12px; border-radius: 99px; background: #eee; color: #333; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 8px; font-family: 'Bungee', Impact, 'Arial Black', sans-serif; letter-spacing: 0.05em; border: 2px solid black; }

        .btn-share { background: var(--camp-yellow); border: 3px solid black; padding: 0.75rem 1.5rem; border-radius: 1rem; font-family: 'Bungee', Impact, 'Arial Black', sans-serif; color: black; box-shadow: 0 5px 0 #000; transition: all 0.1s; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; margin-top: 1rem; width: 100%; cursor: pointer; }
        .btn-share:active { transform: translateY(2px); box-shadow: 0 2px 0 black; }

        #share-toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: black; color: white; padding: 12px 24px; border-radius: 99px; font-family: 'Bungee', Impact, 'Arial Black', sans-serif;
            font-size: 12px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000;
        }
        #share-toast.show { transform: translateX(-50%) translateY(0); }

        /* ADMIN EDITOR */
        #adm { display: none; position: fixed; inset: 0; z-index: 2000; background: #fff7f5; color: #1a1a1a; overflow: auto; font-family: 'Outfit', system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom, 0px); }
        .adm-bar { position: sticky; top: 0; z-index: 2; background: var(--camp-red-dark); color: #fff; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 4px solid #1a1a1a; }
        .adm-bar h2 { font-family: 'Bungee', Impact, sans-serif; font-size: 1rem; margin-right: auto; }
        #adm button, .adm-open { font-weight: 800; border: 3px solid #1a1a1a; border-radius: .75rem; padding: .4rem .8rem; background: #fff; color: #1a1a1a; cursor: pointer; }
        #adm .pri, .adm-open { background: var(--camp-yellow); }
        #adm .dng { background: #fecaca; }
        #adm input, #adm select, #adm textarea { border: 2px solid #1a1a1a; border-radius: .5rem; padding: .35rem .5rem; width: 100%; background: #fff; color: #1a1a1a; font: inherit; }
        #adm label { display: block; font-weight: 700; font-size: .8rem; margin: .6rem 0 .15rem; }
        .adm-wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
        .adm-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        .adm-card { background: #fff; border: 3px solid #1a1a1a; border-radius: 1rem; padding: 12px; }
        .adm-card.off { opacity: .55; }
        .adm-chip { display: inline-block; font-size: .7rem; font-weight: 800; border: 2px solid #1a1a1a; border-radius: 99px; padding: 1px 8px; margin: 2px 2px 0 0; background: #eee; color: #1a1a1a; }
        .adm-msg { background: #fde68a; border: 2px solid #1a1a1a; border-radius: .75rem; padding: 8px 12px; margin-bottom: 12px; font-weight: 700; }
        .adm-ov { position: fixed; inset: 0; z-index: 5; background: rgba(0,0,0,.6); overflow: auto; padding: 16px; }
        .adm-modal { background: #fff; max-width: 680px; margin: 0 auto; border: 4px solid #1a1a1a; border-radius: 1rem; padding: 16px; }
        .adm-err { color: #b91c1c; font-weight: 700; min-height: 1.2em; }
        .adm-open { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 1500; }
        .adm-pal { display: none; max-height: 260px; overflow: auto; border: 2px solid #1a1a1a; border-radius: .5rem; padding: 6px 8px; margin-top: 8px; background: #fff; }
        .adm-pal b { display: block; font-size: .72rem; margin: 8px 0 2px; color: #444; }
        #adm .adm-pal button.em { border: 2px solid transparent; border-radius: .6rem; padding: 0; width: 42px; height: 42px; font-size: 1.5rem; line-height: 1; background: #fff; }
        #adm .adm-pal button.em:hover { background: #fef08a; border-color: #1a1a1a; }
        .adm-pal { max-height: none; overflow: visible; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
        .adm-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0 8px; white-space: nowrap; }
        #adm .adm-tabs button.tab { flex: none; padding: .2rem .65rem; font-size: .75rem; border-width: 2px; border-radius: 99px; }
        #adm .adm-tabs button.tab.on { background: var(--camp-yellow); }
        .adm-grid-em { display: flex; flex-wrap: wrap; max-height: 210px; overflow-y: auto; }
    
        /* THEMED DROPDOWNS AND FIELDS */
        #adm select.dd-native { display: none; }
        .dd { position: relative; }
        #adm .dd-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; background: #fff; color: #1a1a1a; border: 3px solid #1a1a1a; border-radius: 1rem; box-shadow: 0 4px 0 #1a1a1a; padding: .5rem .9rem; font-weight: 800; font-size: .95rem; cursor: pointer; transition: transform .1s, box-shadow .1s, background .1s; }
        #adm .dd-btn:hover { background: #fffbe6; }
        #adm .dd-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a1a1a; }
        .dd-chev { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--camp-red-dark); border: 2px solid #1a1a1a; position: relative; }
        .dd-chev::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; border-right: 3px solid #fff; border-bottom: 3px solid #fff; transform: translate(-50%, -70%) rotate(45deg); transition: transform .15s; }
        .dd.open .dd-chev::after { transform: translate(-50%, -30%) rotate(225deg); }
        .dd-list { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 50; background: #fff; border: 3px solid #1a1a1a; border-radius: 1rem; box-shadow: 0 8px 0 rgba(0,0,0,.2); overflow: hidden auto; max-height: 260px; }
        .dd.open .dd-list { display: block; animation: fadeIn .15s ease-out; }
        #adm .dd-opt { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; border: 0; border-bottom: 2px solid #eee; border-radius: 0; box-shadow: none; background: #fff; padding: .6rem .9rem; font-weight: 700; }
        #adm .dd-opt:last-child { border-bottom: 0; }
        #adm .dd-opt:hover { background: var(--camp-yellow); }
        #adm .dd-opt.sel { background: var(--camp-red-dark); color: #fff; }
        #adm .dd-opt.sel::after { content: "\2713"; font-weight: 900; }
        #adm input:not([type=checkbox]), #adm textarea { border: 3px solid #1a1a1a; border-radius: .9rem; box-shadow: 0 3px 0 #1a1a1a; padding: .45rem .75rem; }
        #adm input:not([type=checkbox]):focus, #adm textarea:focus { outline: none; background: #fffbe6; }
        .adm-pal { border: 3px solid #1a1a1a; border-radius: 1rem; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
    </style>

        let state = { currentIdx: 0, ageMin: 0, ageMax: 0, catScores: {}, campScores: {}, history: [], lastResult: null };

        function resetState() {
            state = { 
                currentIdx: 0, 
                ageMin: 0, 
                ageMax: 0, 
                catScores: { "Get Physical": 0, "Be Creative": 0, "Clever Stuff": 0, "Multi Activity": 0, "Tech Savvy": 0 },

        function showAgeScreen() {
            track('start');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('age-screen').classList.remove('hidden');
        }

        function resetToStart() {
            resetState();
            document.getElementById('age-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function setAge(min, max) {
            track('age', { age: min + '-' + max });
            state.ageMin = min; 
            state.ageMax = max;
            camps.forEach(c => state.campScores[c.id] = 0);
            document.getElementById('age-screen').classList.add('hidden');
            startQuiz();
        }

        function backToBands() {
            document.getElementById('age-screen').classList.remove('hidden');
            resetState();
        }

        // With one camp or none to choose from, skip the questions and go straight to the result
        function startQuiz() {
            document.getElementById('header-nav').classList.remove('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            if (!getEligibleCamps().length) {
                const box = document.getElementById('options-container');
                document.getElementById('question-number').innerText = '--';
                document.getElementById('question-text').innerText = 'We don\u2019t have a camp for this age right now. Check back soon!';
                box.innerHTML = '';
                const b = document.createElement('button');
                b.className = 'btn-option';
                b.innerText = '\u2190 Pick another age';
                b.onclick = () => { document.getElementById('question-screen').classList.add('hidden'); document.getElementById('header-nav').classList.add('hidden'); backToBands(); };
                box.appendChild(b);
                return;
            }
            showQuestion();
        }

        // Answer options: the leading category first, topped up from the next categories so a preference is never lost
        // Fair shuffle used for question order and answer order
        function shuffleArr(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

        function pickOptionCamps(eligible) {
            const sc = state.catScores; state.tie = state.tie || {};
            const tb = k => (state.tie[k] === undefined ? (state.tie[k] = Math.random()) : state.tie[k]);
            const order = Object.keys(sc).sort((a, b) => (sc[b] - sc[a]) || (tb(a) - tb(b)));
            const out = [];
            order.forEach(cat => eligible.filter(c => c.category === cat).sort(() => 0.5 - Math.random()).forEach(c => { if (out.length < 4) out.push(c); }));
            return shuffleArr(out);
        }

        function getEligibleCamps() {
            const hiddenOk = DATA.settings.showHiddenResult !== false;
            return camps.filter(c => (hiddenOk || isLive(c)) && c.minAge <= state.ageMax && c.maxAge >= state.ageMin && (state.ageMax <= 4 ? c.toddler : true));
        }

        function showQuestion() {
            if (state.currentIdx >= 10) { showResult(); return; }
            // every session gets its own question order
            if (!state.order) { state.order = shuffleArr([0, 1, 2, 3, 4, 5, 6]); state.steerOrder = shuffleArr([0, 1, 2]); }
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            document.getElementById('question-number').innerText = (state.currentIdx + 1).toString().padStart(2, '0');
            document.getElementById('progress-bar').style.width = `${((state.currentIdx + 1) / 10) * 100}%`;
            document.getElementById('progress-text').innerText = `${state.currentIdx + 1} of 10`;

            if (state.currentIdx < 3) {
                const q = steerQuestions[state.steerOrder[state.currentIdx]];
                document.getElementById('question-text').innerText = q.q;
                
                shuffleArr(Object.keys(q.a)).forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = "btn-option fade-in";
                    btn.innerText = q.a[cat];
                    btn.onclick = () => {
                        state.history.push({ catScores: {...state.catScores}, campScores: {...state.campScores} });
                        state.catScores[cat]++;
                        state.currentIdx++;
                        showQuestion();
                    };
                    container.appendChild(btn);
                });
            } else {
                const stepIdx = state.currentIdx - 3, qi = state.order[stepIdx];
                
                if (state.ageMax <= 4) {
                    const scenario = toddlerScenarios[qi];
                    document.getElementById('question-text').innerText = scenario.q;
                    shuffleArr(getEligibleCamps().filter(c => c.toddlerAnswers && c.toddlerAnswers[qi])).forEach(tc => { const campId = tc.id;
                        const btn = document.createElement('button');
                        btn.className = "btn-option fade-in";
                        btn.innerText = tc.toddlerAnswers[qi];
                        btn.onclick = () => {
                            state.history.push({ catScores: {...state.catScores}, campScores: {...state.campScores} });
                            state.campScores[campId] = (state.campScores[campId] || 0) + 1;
                            state.currentIdx++;
                            showQuestion();
                        };
                        container.appendChild(btn);
                    });
                } else {
                    const scenario = generalScenarios[qi];
                    document.getElementById('question-text').innerText = scenario.q;
                    
                    const eligible = getEligibleCamps();
                    const shuffled = pickOptionCamps(eligible);
                    shuffled.forEach(camp => {
                        const btn = document.createElement('button');
                        btn.className = "btn-option fade-in";
                        const actionText = (camp.actions && (camp.actions[qi] || camp.actions[0])) || "Explore more";
                        btn.innerText = `${actionText}!`;
                        btn.onclick = () => {
                            state.history.push({ catScores: {...state.catScores}, campScores: {...state.campScores} });
                            state.campScores[camp.id] = (state.campScores[camp.id] || 0) + (1);
                            state.currentIdx++;
                            showQuestion();
                        };
                        container.appendChild(btn);
                    });
                }
            }
        }

        function showResult() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('header-nav').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const eligible = getEligibleCamps().map(c => ({
                ...c,
                finalScore: (state.campScores[c.id] || 0) + 0.3 * (state.catScores[c.category] || 0) + (Math.random() * 0.1)
            })).sort((a, b) => b.finalScore - a.finalScore);
            
            const winner = eligible[0] || camps[0];
            state.lastResult = winner;
            const alts = eligible.slice(1).filter(c => DATA.settings.showHiddenBackups === true || isLive(c)).slice(0, 3);
            state.lastAlts = alts;
            track('result', { age: state.ageMin + '-' + state.ageMax, camp: winner.name, cat: catLabel(winner.category), hid: isLive(winner) ? 0 : 1, alts: alts.map(c => c.name) });

            document.getElementById('result-camp').innerText = winner.name;
            document.getElementById('result-description').innerText = winner.desc;
            const rNote = document.getElementById('result-note');

            rNote.classList.toggle('hidden', isLive(winner));
            document.getElementById('result-avatar').innerText = winner.icon;
            document.getElementById('result-link').href = trackUrl(winner.url, 'quiz-result');
            document.getElementById('result-link').onclick = () => track('click_result', { age: state.ageMin + '-' + state.ageMax, camp: winner.name, cat: catLabel(winner.category) });

            const catStyles = {

                "Get Physical": { bg: "black", text: "white" },
                "Be Creative": { bg: "#fecaca", text: "black" },

            catTag.style.backgroundColor = style.bg;

            document.getElementById('alts-title').style.display = alts.length ? '' : 'none';
            alts.forEach(c => {
                const alt = document.createElement('a');
                alt.href = trackUrl(c.url, 'quiz-backup');
                alt.onclick = () => track('click_backup', { age: state.ageMin + '-' + state.ageMax, camp: c.name, cat: catLabel(c.category) });
                alt.target = "_blank";
                alt.className = "bg-white border-2 border-black rounded-xl p-2 flex flex-col items-center hover:bg-gray-50 transition-colors";
                alt.innerHTML = `<div class="text-xl">${c.icon}</div><div class="bungee text-[8px] text-black text-center line-clamp-1">${c.name}</div>${isLive(c) ? '' : '<div class="text-[7px] font-bold text-red-600 text-center leading-tight uppercase">Not available this season</div>'}`;
                altsList.appendChild(alt);
            });
        }

        function shareResult() { return shareResultPdf(); }

        // Adds tracking tags so your website analytics can show visits that came from the quiz (empty tag in the editor = off)
        function trackUrl(u, medium) {
            const src = String(DATA.settings.utmSource === undefined ? "camp-quiz" : DATA.settings.utmSource).trim();
            if (!src) return u;
            try {
                const x = new URL(u), camp = String(DATA.settings.frontHeader || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
                x.searchParams.set("utm_source", src); x.searchParams.set("utm_medium", medium); x.searchParams.set("utm_campaign", camp || "general");
                return x.toString();
            } catch (e) { return u; }
        }

        const CAT_PDF = { "Multi Activity": ["#bae6fd", "#000000"], "Get Physical": ["#000000", "#ffffff"], "Be Creative": ["#fecaca", "#000000"], "Clever Stuff": ["#bbf7d0", "#000000"], "Tech Savvy": ["#6b7280", "#ffffff"] };
        const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
        const pdfText = s => String(s == null ? "" : s).replace(/[^\x20-\x7E\u00A0-\u00FF\u2018\u2019\u201C\u201D\u2013\u2014\u2026]/g, "").replace(/\s+/g, " ").trim();

        async function savePdfViaClaude(blob, fname) {
            try {
                const d = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
                if (!d) return false;
                await d.save({ filename: fname, data: blob });
                showToast("PDF SAVED");
                return true;
            } catch (e) { return !!(e && e.code === "declined"); }
        }

        function anchorDownload(blob, fname) {
            try {
                const u = URL.createObjectURL(blob), a = document.createElement("a");
                a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(u), 4000);
                return true;
            } catch (e) { return false; }
        }

        async function shareResultPdf() {
            if (state.lastResult) track('share_pdf', { camp: state.lastResult.name, cat: catLabel(state.lastResult.category) });
            if (!state.lastResult) return;
            const btn = document.getElementById("share-btn"), label = btn.querySelector("span"), orig = label.textContent;
            if (btn.dataset.busy) return;
            btn.dataset.busy = "1"; label.textContent = "MAKING PDF...";
            try {
                if (!window.jspdf) throw new Error("PDF tool not loaded");
                const blob = buildResultPdf();
                const fname = "camp-asia-match-" + state.lastResult.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".pdf";
                const file = new File([blob], fname, { type: "application/pdf" });
                const text = "I\u2019m a match for " + state.lastResult.icon + " " + state.lastResult.name + " at Camp Asia! Take the quiz: " + quizLink();
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try { await navigator.share({ files: [file], title: "My Camp Asia Match!", text }); return; }
                    catch (e) { if (e && e.name === "AbortError") return; }
                }
                if (await savePdfViaClaude(blob, fname)) return;
                if (anchorDownload(blob, fname)) { showToast("PDF DOWNLOADED"); return; }
                showToast("COULDN\u2019T SAVE THE PDF HERE");
            } catch (e) { console.error(e); showToast("COULDN\u2019T MAKE THE PDF"); }
            finally { label.textContent = orig; delete btn.dataset.busy; }
        }
        function forceCopyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            textArea.setAttribute('readonly', '');
            document.body.appendChild(textArea);
            
            const isiOSDevice = navigator.userAgent.match(/ipad|iphone/i);

            if (isiOSDevice) {
                const range = document.createRange();
                range.selectNodeContents(textArea);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                textArea.setSelectionRange(0, 999999);
            } else {
                textArea.select();
            }
            
            let successful = false;
            try {
                successful = document.execCommand('copy');
            } catch (err) {
                console.error('Unable to copy', err);
            }

            document.body.removeChild(textArea);
            return successful;
        }

        const nk = s => s.replace(/\uFE0F/g, "");
        const EMOJI_KW = new Map(("⚽ soccer football ball|🏀 basketball hoops|🏈 american football|⚾ baseball|🎾 tennis|🏐 volleyball|🏉 rugby|🥏 frisbee disc|🎱 pool billiards|🏓 ping pong table tennis|🏸 badminton|🏒 ice hockey|🏑 field hockey|🥍 lacrosse|🏏 cricket|⛳ golf|🏹 archery bow arrow|🎣 fishing|🤿 snorkel diving scuba|🥊 boxing|🥋 martial arts karate judo|🛹 skateboard|🛼 roller skate|🛷 sled|⛸ ice skating|🎿 ski|🏂 snowboard|🪂 parachute|🏋 weights gym lifting|🤸 gymnastics cartwheel|🤾 handball|🏊 swim swimming pool|🚴 cycling bike|🏃 run running parkour|🧗 climbing|🤺 fencing|🏇 horse riding|🧘 yoga|🏆 trophy winner|🥇 gold medal|🏅 medal|🎯 target darts|🪁 kite|🤹 juggling|🎨 art painting palette|🖌 paintbrush|🖍 crayon|✏ pencil draw|📝 write notes|🎭 drama theatre masks acting|🎬 film movie clapper|🎤 microphone sing|🎧 headphones music|🎼 music score|🎹 piano keyboard|🥁 drum|🎸 guitar|🎻 violin|🎺 trumpet|🎷 saxophone|🪕 banjo|🪘 conga drum|🪗 accordion|💃 dance dancer|🕺 dance disco|📷 camera photo|🧶 yarn knit|🧵 thread sewing|🪡 needle sew|✂ scissors craft|🪄 magic wand|🎪 circus tent|🎠 carousel|🎡 ferris wheel|🎢 roller coaster|🎟 ticket|🖼 picture frame gallery|🏺 pottery vase|📚 books|📖 book reading story|✍ writing|🎙 podcast microphone|🔬 microscope science|🧪 test tube experiment chemistry|🧫 petri dish|🧬 dna genetics|⚗ alembic chemistry|🔭 telescope astronomy|🚀 rocket space|🛰 satellite|🤖 robot|💻 laptop computer coding|🖥 desktop computer|⌨ keyboard|🖱 mouse|🎮 video game controller|🕹 joystick arcade|👾 alien game|🔌 plug electric circuit|🔋 battery|💡 idea light bulb|🔧 wrench tool|🔩 nut bolt|⚙ gear engineering|🛠 tools build maker|🧲 magnet|📡 antenna satellite dish|📱 phone app|🧮 abacus maths|🔢 numbers maths|➕ plus add|➗ divide maths|📐 triangle ruler geometry|📏 ruler measure|🩺 stethoscope doctor medic|💉 syringe|🩹 bandage first aid|🦠 germ microbe|🧠 brain|🫀 heart anatomy|🦴 bone skeleton|🔎 magnifying glass detective|🌡 thermometer|⚡ lightning electricity|🌟 star glow|⭐ star|✨ sparkles|🌈 rainbow|🌙 moon|🪐 planet saturn|☄ comet|👽 alien|🛸 ufo|🦄 unicorn|🐉 dragon|🧙 wizard|🧚 fairy|🧜 mermaid|🧞 genie|🧛 vampire|🦸 superhero|🦹 villain|🥷 ninja|🏰 castle|🗝 key|👑 crown king queen|💎 gem diamond|🔮 crystal ball|🎩 top hat magician|🎃 pumpkin|🏴‍☠️ pirate flag|🧿 evil eye|🦁 lion|🐯 tiger|🐻 bear|🐼 panda|🐨 koala|🐵 monkey|🐸 frog|🐢 turtle|🐙 octopus|🦈 shark|🐬 dolphin|🐳 whale|🦀 crab|🐠 fish tropical|🦋 butterfly|🐝 bee|🐞 ladybug|🦖 t-rex dinosaur|🦕 dinosaur|🐘 elephant|🦒 giraffe|🦓 zebra|🦜 parrot bird|🦉 owl|🦊 fox|🐺 wolf|🐶 dog puppy|🐱 cat kitten|🐰 rabbit bunny|🐿 squirrel|🦔 hedgehog|🌳 tree|🌴 palm tree|🌵 cactus desert|🌻 sunflower|🌺 flower hibiscus|🍀 clover luck|🍄 mushroom|🌋 volcano|⛰ mountain|🏝 island beach|🌊 wave ocean sea|🔥 fire|❄ snow snowflake|☀ sun sunny|🏕 camping camp|⛺ tent|🧭 compass explore|🗺 map|🎒 backpack|🔦 flashlight torch|🪵 log wood|🛶 canoe kayak|⛵ sailboat|🚤 speedboat|🚢 ship|🚁 helicopter|✈ airplane|🚂 train|🚌 bus|🚲 bicycle|🛴 scooter|🏎 race car|🏍 motorbike|🚜 tractor|🏙 city skyline|🌆 city dusk|🗽 statue of liberty new york|🏛 museum building|🏖 beach|🌅 sunrise|🎈 balloon party|🎆 fireworks|🎇 sparkler|🏔 snowy mountain|👨‍🍳 chef cook|👩‍🍳 chef cook|🍳 frying egg cooking|🥞 pancakes|🧁 cupcake baking|🍰 cake|🎂 birthday cake|🍪 cookie|🍩 donut|🍦 ice cream|🍕 pizza|🍔 burger|🌮 taco|🌯 burrito wrap|🍣 sushi|🍜 noodles ramen|🍝 pasta spaghetti|🥗 salad|🍎 apple|🍓 strawberry|🍉 watermelon|🥕 carrot|🌽 corn|🥑 avocado|🍞 bread baking|🧀 cheese|🥨 pretzel|🍿 popcorn|🧃 juice box|🍯 honey|🥄 spoon|🍴 fork knife|🔪 knife|🥣 bowl mixing|🔤 abc letters english|🔡 letters lowercase|🅰 letter a|🌍 world globe earth africa|🌎 world globe americas|🗣 speaking talk|💬 chat speech|📣 megaphone|🇪🇸 spanish spain|🇫🇷 french france|🇨🇳 chinese china mandarin|🇯🇵 japanese japan|🏫 school|🎓 graduation|🧑‍🏫 teacher|💰 money bag|💵 dollar cash|🪙 coin|💳 credit card|🏦 bank|📈 chart growth|📊 bar chart data|🛒 shopping cart|🏪 shop store|🤝 handshake deal|💼 briefcase business|📋 clipboard|⏰ alarm clock time|🧩 puzzle|♟ chess|🎲 dice game|🔑 key|😀 happy smile|😎 cool sunglasses|🤩 starstruck wow|🥳 party celebrate|😜 silly wink|🤗 hug|😇 angel|🤠 cowboy|👻 ghost|💥 boom explosion|🎉 party popper|🎊 confetti|🎁 gift present|💯 hundred|❤ heart red love|🧡 heart orange|💛 heart yellow|💚 heart green|💙 heart blue|💜 heart purple|🙌 hooray hands|👏 clap|💪 strong muscle|🤟 love you hand|✌ peace victory|👍 thumbs up|🫶 heart hands|🐾 paw prints").split("|").map(s => { const i = s.indexOf(" "); return [nk(s.slice(0, i)), s.slice(i + 1)]; }));
        let palTab = "";
        const palHtml = () => { palTab = ""; return `<div class="adm-pal" id="e-pal"><input id="e-q" placeholder="Search emojis, e.g. soccer, robot, cake" autocomplete="off"><div class="adm-tabs" id="e-tabs"><button type="button" class="tab on" data-a="palTab" data-g="">All</button>${Object.keys(EMOJI_GROUPS).map(g => `<button type="button" class="tab" data-a="palTab" data-g="${g}">${g}</button>`).join("")}</div><div class="adm-grid-em" id="e-grid"></div></div>`; };
        function renderPal() {
            const q = (document.getElementById("e-q").value || "").trim().toLowerCase(), words = q ? q.split(/\s+/) : [], out = [];
            Object.entries(EMOJI_GROUPS).forEach(([name, s]) => {
                if (palTab && !q && palTab !== name) return;
                s.split(" ").forEach(e => { const kw = (EMOJI_KW.get(nk(e)) || "") + " " + name.toLowerCase(); if (words.every(w => kw.includes(w))) out.push(e); });
            });
            document.getElementById("e-grid").innerHTML = out.length ? [...new Set(out)].map(e => `<button type="button" class="em" data-a="pick" data-e="${e}">${e}</button>`).join("") : `<p style="padding:8px;font-size:.85rem">No emoji found. Try another word.</p>`;
        }

        function editModal() {
            const c = draft.camps[editIdx], s = draft.settings;
            return `<div class="adm-ov"><div class="adm-modal"><h3 style="font-family:'Bungee',Impact,sans-serif">${c._new ? "Add camp" : "Edit camp"}</h3>
                <div class="adm-grid"><div><label>Camp name</label><input id="e-name" value="${esc(c.name)}"></div><div><label>Icon (tap Pick, or type or paste any emoji)</label><div style="display:flex;gap:6px"><input id="e-icon" value="${esc(c.icon)}" style="font-size:1.4rem"><button type="button" data-a="palToggle">Pick</button></div></div>
                <div><label>Category</label><select id="e-cat">${CATEGORIES.map(x => `<option value="${esc(x)}" ${x === c.category ? "selected" : ""}>${esc(s.categoryNames[x] || x)}</option>`).join("")}</select></div>
                <div><label>Minimum age</label><input id="e-min" type="number" min="3" max="16" value="${c.minAge}"></div><div><label>Maximum age</label><input id="e-max" type="number" min="3" max="16" value="${c.maxAge}"></div></div>
                ${palHtml()}
                <label>Camp web page URL</label><input id="e-url" value="${esc(c.url)}">
                <label>Description (shown on the result)</label><textarea id="e-desc" rows="2">${esc(c.desc)}</textarea>
                <label><input type="checkbox" id="e-active" ${c.active !== false ? "checked" : ""} style="width:auto"> Show in the quiz (untick to hide)</label>
                <label><input type="checkbox" id="e-tod" ${c.toddler ? "checked" : ""} style="width:auto"> Offer in the 3–4 yrs quiz</label>
                <label>Runs in (tick none = every season)</label><div>${s.seasons.map(x => `<label style="display:inline-block;margin-right:12px"><input type="checkbox" class="e-ssn" value="${esc(x)}" ${(c.seasons || []).includes(x) ? "checked" : ""} style="width:auto"> ${esc(x)}</label>`).join("")}</div>
                <label>Quiz answers for this camp, one per line (questions 4–10 use lines 1–7)</label><textarea id="e-act" rows="7">${esc((c.actions || []).join("\n"))}</textarea>
                <label>3–4 yrs answers, one per line (7 questions; used only if ticked above)</label><textarea id="e-ta" rows="7">${esc((c.toddlerAnswers || []).join("\n"))}</textarea>
                <p class="adm-err" id="e-err"></p>
                <div style="display:flex;gap:8px"><button class="pri" data-a="applyEdit">Apply</button><button data-a="cancelEdit">Cancel</button></div></div></div>`;
        }

        function applyEdit() {
            const g = id => document.getElementById(id), c = draft.camps[editIdx];
            const name = g("e-name").value.trim(), min = parseInt(g("e-min").value, 10), max = parseInt(g("e-max").value, 10), url = g("e-url").value.trim();
            const fail = m => { g("e-err").textContent = m; return false; };
            if (!name) return fail("Give the camp a name.");
            if (!(min >= 3 && max <= 16 && min <= max)) return fail("Ages must be between 3 and 16, with the minimum no higher than the maximum.");
            if (!/^https?:\/\/./.test(url)) return fail("Enter the full camp page URL, starting with https://");
            const lines = v => { const a = v.split("\n").map(x => x.trim()); while (a.length && !a[a.length - 1]) a.pop(); return a; };
            Object.assign(c, { name, icon: g("e-icon").value.trim() || "⭐", category: g("e-cat").value, minAge: min, maxAge: max, url, desc: g("e-desc").value.trim(), active: g("e-active").checked, toddler: g("e-tod").checked, seasons: [...document.querySelectorAll(".e-ssn:checked")].map(x => x.value), actions: lines(g("e-act").value), toddlerAnswers: lines(g("e-ta").value) });
            delete c._new; editIdx = -1; dirty = true;
            return true;
        }

        function onAdmChange(ev) {
            const fc = ev.target.dataset && ev.target.dataset.fc;
            if (fc) { draft.settings[fc] = ev.target.checked; dirty = true; renderAdmin(); return; }
            const f = ev.target.dataset && ev.target.dataset.f; if (!f) return;
            const s = draft.settings, v = ev.target.value;
            if (f === "seasons") { s.seasons = v.split(",").map(x => x.trim()).filter(Boolean); draft.camps.forEach(c => c.seasons = (c.seasons || []).filter(x => s.seasons.includes(x))); if (!s.seasons.includes(s.currentSeason)) s.currentSeason = ""; }
            else if (f.indexOf("cat:") === 0) s.categoryNames[f.slice(4)] = v.trim() || f.slice(4);
            else s[f] = v.trim();
            dirty = true; renderAdmin();
        }

        async function onAdmClick(ev) {
            if (!ev.target.closest(".dd")) document.querySelectorAll("#adm .dd.open").forEach(x => x.classList.remove("open"));
            const b = ev.target.closest("[data-a]"); if (!b) return;
            const a = b.dataset.a, i = +b.dataset.i, key = a + i;
            if ((a === "del" || a === "reset") && armed !== key) { armed = key; b.textContent = "Click again to confirm"; setTimeout(() => { if (armed === key) { armed = null; renderAdmin(); } }, 3000); return; }
            armed = null; msg = "";
            if (a === "palToggle") { const p = document.getElementById("e-pal"), open = p.style.display !== "block"; p.style.display = open ? "block" : "none"; if (open) renderPal(); return; }
            if (a === "palTab") { palTab = b.dataset.g; document.querySelectorAll("#e-tabs .tab").forEach(t => t.classList.toggle("on", t === b)); renderPal(); return; }
            if (a === "pick") { document.getElementById("e-icon").value = b.dataset.e; document.getElementById("e-pal").style.display = "none"; return; }
            if (a === "ddToggle") { const dd = b.closest(".dd"), open = !dd.classList.contains("open"); document.querySelectorAll("#adm .dd.open").forEach(x => x.classList.remove("open")); if (open) dd.classList.add("open"); return; }
            if (a === "ddPick") { const dd = b.closest(".dd"), sel = dd.previousElementSibling; sel.selectedIndex = i; dd.querySelector(".dd-label").textContent = sel.options[i].text; dd.querySelectorAll(".dd-opt").forEach((o, k) => o.classList.toggle("sel", k === i)); dd.classList.remove("open"); sel.dispatchEvent(new Event("change", { bubbles: true })); return; }
            if (a === "close") { document.getElementById("adm").style.display = "none"; return; }
            if (a === "toggle") { draft.camps[i].active = draft.camps[i].active === false; dirty = true; }
            else if (a === "del") { draft.camps.splice(i, 1); dirty = true; }
            else if (a === "reset") { draft.camps = clone(DEFAULT_DATA.camps); dirty = true; }
            else if (a === "add") { draft.camps.unshift({ id: "c_" + Date.now().toString(36), name: "", icon: "⭐", category: CATEGORIES[0], minAge: 5, maxAge: 12, desc: "", url: "https://", active: true, seasons: [], toddler: false, actions: [], toddlerAnswers: [], _new: true }); editIdx = 0; }
            else if (a === "dup") { const n = clone(draft.camps[i]); n.id = "c_" + Date.now().toString(36); n.name = n.name + " (copy)"; n._new = true; draft.camps.splice(i + 1, 0, n); editIdx = i + 1; }
            else if (a === "edit") { editIdx = i; }
            else if (a === "cancelEdit") { if (draft.camps[editIdx]._new) draft.camps.splice(editIdx, 1); editIdx = -1; }
            else if (a === "applyEdit") { if (!applyEdit()) return; }
            else if (a === "json") { jsonText = JSON.stringify({ settings: draft.settings, camps: draft.camps }, null, 1); jsonOpen = true; }
            else if (a === "jsonClose") { jsonOpen = false; }
            else if (a === "jsonImport") {
                try { const p = JSON.parse(document.getElementById("j-text").value); if (!Array.isArray(p.camps)) throw 0; draft.camps = p.camps; if (p.settings) { draft.settings = { ...DEFAULT_DATA.settings, ...p.settings }; draft.settings.categoryNames = { ...DEFAULT_DATA.settings.categoryNames, ...(draft.settings.categoryNames || {}) }; } dirty = true; jsonOpen = false; msg = "Imported. Check the camps, then save."; }
                catch (e) { msg = "That JSON couldn’t be read. Nothing was changed."; }
            }
            else if (a === "save") { await savePublish(); }
            else if (a === "dl") { await downloadPage(); }
            renderAdmin();
        }

        // Rebuilds the whole quiz page from its source pieces plus the edited camp data
        function buildHtml() {
            const data = JSON.stringify({ settings: draft.settings, camps: draft.camps.map(({ _new, ...c }) => c) }).replace(/</g, "\\u003c");
            return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n" + PAGE_HEAD + "\n<style data-keep>" + PAGE_CSS + "</style>\n</head>\n<body>\n" + PAGE_BODY + "\n<script type=\"application/json\" id=\"camp-data\">" + data + "<\/script>\n<script id=\"main-script\">" + PAGE_JS + "<\/script>\n</body>\n</html>";
        }

        async function savePublish() {
            const cl = await waitClaude(); let art = null;
            try { art = cl && await cl.use("artifact"); } catch (e) {}
            if (!art) { msg = "Publishing isn’t available in this view. Use Download page to keep your changes."; return; }
            try { await art.publish(buildHtml()); dirty = false; msg = "Published. The quiz now uses your changes."; }
            catch (e) { msg = (e && e.code === "not_writer") ? "This account can view the quiz but not change it." : "Couldn’t publish (" + ((e && (e.code || e.message)) || "unknown error") + "). Use Download page to keep your changes."; }
        }

        async function downloadPage() {
            try { const cl = await waitClaude(); const d = cl && await cl.use("downloads"); if (!d) throw {}; await d.save({ filename: "camp-asia-quiz.html", data: buildHtml() }); msg = ""; }
            catch (e) { msg = (e && e.code === "declined") ? "" : "Download isn’t available in this view. Use Data (JSON) to copy your camps instead."; }
        }

        async function initAdmin() {
            try {
                const cl = await waitClaude(); if (!cl) return;
                const u = await cl.use("user"); if (!u || !(await u.canEdit())) return;
                const b = document.createElement("button"); b.className = "adm-open"; b.textContent = "⚙ Edit camps"; b.onclick = openAdmin; document.body.appendChild(b);
                if (location.hash === "#admin") openAdmin();
            } catch (e) {}
        }
        function applyFrontHeader() {
            const h = (DATA.settings.frontHeader || "").trim();
            document.getElementById("front-header").textContent = h;
            document.getElementById("front-wrap").classList.toggle("hidden", !h);
        }
        // ===== USAGE ANALYTICS (anonymous; only sends data if a collector URL or Google Analytics ID is set in the editor) =====
        const SESSION_ID = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        function trackRef() {
            try {
                const q = new URLSearchParams(location.search).get("utm_source");
                if (q) return q.slice(0, 40);
                return document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, "") : "direct";
            } catch (e) { return ""; }
        }
        function track(ev, d) {
            try {
                const s = DATA.settings;
                const p = Object.assign({ ev: ev, sid: SESSION_ID, season: String(s.frontHeader || ""), dev: (window.matchMedia && window.matchMedia("(max-width: 767px)").matches) ? "mobile" : "desktop", ref: trackRef() }, d || {});
                const url = String(s.analyticsUrl || "").trim();
                if (/^https:\/\//i.test(url)) {
                    const body = JSON.stringify(p);
                    let sent = false;
                    try { sent = navigator.sendBeacon ? navigator.sendBeacon(url, new Blob([body], { type: "text/plain" })) : false; } catch (e) {}
                    if (!sent) fetch(url, { method: "POST", mode: "no-cors", body: body }).catch(() => {});
                }
                if (window.gtag) window.gtag("event", "camp_quiz_" + ev, { age_group: p.age, camp: p.camp, category: p.cat, season: p.season });
            } catch (e) {}
        }
        function initGA() {
            const id = String(DATA.settings.gaId || "").trim();
            if (!/^G-[A-Z0-9]{4,}$/i.test(id) || window.claude) return;
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { window.dataLayer.push(arguments); };
            const sc = document.createElement("script"); sc.async = true; sc.src = "https://www.googletagmanager.com/gtag/js?id=" + id; document.head.appendChild(sc);
            window.gtag("js", new Date()); window.gtag("config", id);
        }

        applyFrontHeader();
        initGA();
        track("open");
        initAdmin();

        resetState();
    </script>
